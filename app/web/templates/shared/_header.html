<header class="app-header">
  <div class="brand">
    <span class="wordmark">Pipeline.</span>
    <span class="job-title">{{ job_title }}</span>
  </div>
  <div class="search-container">
    <input
      type="search"
      class="search-input"
      placeholder="Search candidates… (coming soon)"
      disabled
      aria-label="Search candidates"
    >
  </div>
  <button
    type="button"
    class="btn-round"
    hx-get="/ui/candidates/new"
    hx-target="#dialog"
    hx-swap="innerHTML"
    aria-label="Add candidate"
  >+</button>
</header>
